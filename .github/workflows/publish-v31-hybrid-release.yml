name: Publish Salatak 31.0 Hybrid APK
on:
  workflow_dispatch:
  push:
    branches: [fix/v31-hybrid-adhan-netlify-20261025]
    paths: ['.github/workflows/publish-v31-hybrid-release.yml']
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v31-hybrid-adhan-netlify-20261025
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Acquire the exact hybrid 31 adhan audio assets
        run: |
          mkdir -p android-adhan-v28/app/src/main/res/raw
          curl --fail --location --retry 3 "https://relaxed-kitsune-ff167d.netlify.app/prayer-audio/adhan.mp3" -o android-adhan-v28/app/src/main/res/raw/adhan.mp3
          curl --fail --location --retry 3 "https://relaxed-kitsune-ff167d.netlify.app/prayer-audio/adhan_fajr.mp3" -o android-adhan-v28/app/src/main/res/raw/adhan_fajr.mp3
          test "$(wc -c < android-adhan-v28/app/src/main/res/raw/adhan.mp3)" -gt 100000
          test "$(wc -c < android-adhan-v28/app/src/main/res/raw/adhan_fajr.mp3)" -gt 100000
      - name: Generate original green app icon
        run: |
          python -m pip install cairosvg
          mkdir -p android-adhan-v28/app/src/main/res/drawable
          python -c "import cairosvg; cairosvg.svg2png(url='artifacts/mushaf-prayer/public/favicon.svg',write_to='android-adhan-v28/app/src/main/res/drawable/icon_green.png',output_width=192,output_height=192)"
      - name: Build unchanged 31.0-hybrid APK
        working-directory: android-adhan-v28
        run: |
          grep -q "versionCode 31" app/build.gradle
          grep -q "versionName '31.0-hybrid'" app/build.gradle
          gradle :app:assembleDebug --no-daemon
      - name: Publish GitHub release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v31.0-hybrid android-adhan-v28/app/build/outputs/apk/debug/app-debug.apk \
            --repo "${{ github.repository }}" \
            --title "صلاتك مع الإمام 31.0 Hybrid" \
            --notes "نسخة Android 31.0-hybrid كما هي في الفرع fix/v31-hybrid-adhan-netlify-20261025. هذه نسخة الاختبار التي أكد صاحب التطبيق أنها تعمل لديه. لا تتضمن تغييرات واجهة النسخ التجريبية الخالية من Netlify."
