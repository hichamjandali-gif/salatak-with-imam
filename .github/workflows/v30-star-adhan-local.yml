name: Build clean prayer features Android APK
on:
  push:
    branches: [fix-v30-quran-audio-20261027]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Quran and imam frontend
        env:
          PORT: '5173'
          BASE_PATH: './'
          NODE_ENV: production
        run: pnpm --filter @workspace/mushaf-prayer build
      - name: Embed site in APK without remote host
        run: |
          mkdir -p android-adhan-v28/app/src/main/assets
          cp -a artifacts/mushaf-prayer/dist/public/. android-adhan-v28/app/src/main/assets/
          # Preserve relative module URLs while giving the SPA a valid home path.
          python3 -c 'from pathlib import Path; p=Path("android-adhan-v28/app/src/main/assets/index.html"); t=p.read_text(); t=t.replace("<head>", "<head><base href=\"/assets/\"><script>if(location.hostname===`appassets.androidplatform.net` && location.pathname===`/assets/index.html`){history.replaceState(null,0,`/`);}</script>", 1); p.write_text(t)'
          test -s android-adhan-v28/app/src/main/assets/index.html
          ! grep -RiqE 'relaxed-kitsune|netlify\.app|Powered by Netlify|replit\.app|adsbygoogle|googlesyndication' android-adhan-v28/app/src/main/assets
          ! grep -iqE 'netlify\.app|replit\.app' android-adhan-v28/app/src/main/java/com/jandali/salatak/adhan/NativeApp.java
      - name: Reuse verified v29 offline adhan audio from GitHub Actions backup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/12608987685/zip" -o /tmp/v29-audio-source.zip
          unzip -p /tmp/v29-audio-source.zip app-debug.apk > /tmp/v29-audio-source.apk
          mkdir -p android-adhan-v28/app/src/main/res/raw
          unzip -p /tmp/v29-audio-source.apk res/raw/adhan.mp3 > android-adhan-v28/app/src/main/res/raw/adhan.mp3
          unzip -p /tmp/v29-audio-source.apk res/raw/adhan_fajr.mp3 > android-adhan-v28/app/src/main/res/raw/adhan_fajr.mp3
          test "$(wc -c < android-adhan-v28/app/src/main/res/raw/adhan.mp3)" -gt 100000
          test "$(wc -c < android-adhan-v28/app/src/main/res/raw/adhan_fajr.mp3)" -gt 100000
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: android-adhan-v28
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Salatak_v30_Star_Adhan_No_Host_APK
          path: android-adhan-v28/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
